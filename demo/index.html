<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fresh Eggs Daily — Demo</title><style>body{margin:0;background:#fff9f1;color:#3b342e;font:16px system-ui}header{background:#a72c32;color:white;padding:22px}main{max-width:850px;margin:auto;padding:20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}button{border:1px solid #d5bdb4;background:white;padding:12px;border-radius:12px;cursor:pointer}.active{background:#a72c32;color:white}.card{background:white;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 2px 12px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.tile{background:#f8ece3;padding:18px;border-radius:14px}input,select{padding:12px;border:1px solid #d5bdb4;border-radius:9px}.small{color:#806f64;font-size:14px}</style><header><h1>🥚 Fresh Eggs Daily</h1><div>Your backyard flock companion • Interactive concept demo</div></header><main><nav id="tabs"></nav><div id="view"></div><p class="small">Demonstration with fictional flock data. No live store, weather or health integrations.</p></main><script>const sections=['Dashboard','My Flock','Egg Tracker','Coop Care','Learn','Shop'];let current='Dashboard',eggs=7,done=[];let birds=['Daisy • Buff Orpington','Pepper • Barred Rock','Olive • Easter Egger'];function render(){document.getElementById('tabs').innerHTML=sections.map(x=>'<button class="'+(current===x?'active':'')+'" onclick="current=\''+x+'\';render()">'+x+'</button>').join('');let html='';if(current==='Dashboard')html='<div class="card"><h2>Good morning, flock keeper!</h2><div class="grid"><div class="tile"><h2>'+birds.length+'</h2>Chickens</div><div class="tile"><h2>'+eggs+'</h2>Eggs today</div><div class="tile"><h2>'+done.length+'/3</h2>Chores done</div></div><p>Keep your flock thriving with simple daily routines.</p></div>';if(current==='My Flock')html='<div class="card"><h2>My Flock</h2><div id="birdList">'+birds.map(b=>'<div class="tile" style="margin:8px 0">🐔 '+b+'</div>').join('')+'</div><h3>Add a chicken</h3><input id="birdName" placeholder="Name"><select id="breed"><option>Buff Orpington</option><option>Rhode Island Red</option><option>Easter Egger</option><option>Other</option></select><button onclick="let n=document.getElementById(\'birdName\').value.trim();if(n){birds.push(n+\' • \'+document.getElementById(\'breed\').value);render()}">Add to flock</button></div>';if(current==='Egg Tracker')html='<div class="card"><h2>Egg Tracker</h2><div class="tile"><h2>'+eggs+'</h2>Eggs logged today</div><p>Record your collection:</p><button onclick="eggs++;render()">+ Add egg</button> <button onclick="eggs=Math.max(0,eggs-1);render()">− Remove egg</button><p class="small">Changes are for this demo session only.</p></div>';if(current==='Coop Care')html='<div class="card"><h2>Today’s Coop Care</h2>'+['Refresh water','Collect eggs','Check nesting boxes'].map(t=>'<p><label><input type="checkbox" '+(done.includes(t)?'checked':'')+' onchange="done=this.checked?[...done,\''+t+'\']:done.filter(x=>x!==\''+t+'\');render()"> '+t+'</label></p>').join('')+'<h3>Upcoming</h3><p>Clean bedding • Feed inventory • Seasonal coop inspection</p></div>';if(current==='Learn')html='<div class="card"><h2>Fresh Eggs Daily Academy</h2><div class="grid"><div class="tile">🐣 Raising Chicks<br><small>Brooder basics</small></div><div class="tile">🥚 Egg Production<br><small>Understand laying patterns</small></div><div class="tile">🏡 Coop Care<br><small>Daily and seasonal routines</small></div><div class="tile">🌿 Nutrition<br><small>Feed and enrichment basics</small></div></div></div>';if(current==='Shop')html='<div class="card"><h2>Discover Fresh Eggs Daily</h2><p>Featured categories</p><div class="grid"><div class="tile">Supplements</div><div class="tile">Treats & Enrichment</div><div class="tile">Coop Care</div><div class="tile">Chick Care</div></div><p class="small">Product ordering is not connected in this demo.</p></div>';document.getElementById('view').innerHTML=html}render();</script></html>
